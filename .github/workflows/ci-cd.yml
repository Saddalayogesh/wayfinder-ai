name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel stale runs for the same branch/PR — saves CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Test, package, and build the Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend tests (JUnit 5 + MockMvc, in-memory H2)
        run: cd backend && mvn -B test

      - name: Frontend tests (Vitest + React Testing Library)
        run: cd frontend && npm ci && npm test

      - name: Frontend typecheck and production build (tsc + vite)
        run: cd frontend && npm run build

      # frontend/dist was already produced by the build step above, so skip
      # frontend-maven-plugin's Node download/install/build (same flags the
      # Dockerfile uses) — the SPA is embedded from the existing dist.
      - name: Package the executable JAR (React SPA embedded)
        run: cd backend && mvn -B package -DskipTests -Dskip.installnodenpm=true -Dskip.npm=true -Dskip.npx=true

      - name: Validate docker-compose config
        run: docker compose config --quiet

      # Quoted: the colon inside “multi-stage:” is a YAML mapping indicator
      # in a plain scalar and previously made this whole workflow invalid.
      - name: "Build the Docker image (multi-stage: node -> maven -> JRE)"
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: wayfinder-ai:ci

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the Docker image to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
