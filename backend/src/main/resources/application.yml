server:
  port: 8080

spring:
  application:
    name: wayfinder-ai

  mvc:
    pathmatch:
      # springdoc-openapi uses PathPattern.combine() which is incompatible
      # with the default PathPatternParser in Spring Framework 6.2+.
      matching-strategy: ant_path_matcher

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/wayfinder_ai?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    # Local development default only — override via DB_PASSWORD (or better,
    # an environment variable / secret manager) in production.
    password: ${DB_PASSWORD:Yogesh@123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  # Caching for place enrichment data only (never trips — those are
  # user-specific and mutate often).
  #   CACHE_TYPE=simple  -> in-memory ConcurrentMap (zero setup, default)
  #   CACHE_TYPE=redis   -> Redis via the connection below
  cache:
    type: ${CACHE_TYPE:simple}

  data:
    redis:
      # Host/port come from env vars so they match the 'redis' service name
      # used in docker-compose (localhost works for a locally-mapped port).
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# JWT signing configuration. The default secret is for local development
# only — override JWT_SECRET with a strong random value in production.
app:
  jwt:
    secret: ${JWT_SECRET:TonncSZLaN4gggtvHuzDet44Uh6YSTF20h12GnSPcmIjow5hdkJDR7CCGE9k4Ta9}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  # Per-user rate limiting for AI itinerary generation (token bucket).
  rate-limit:
    generate:
      capacity: 3
      refill-per-minute: 1

# Google Gemini (Generative Language API). The API key is read exclusively
# from the GEMINI_API_KEY environment variable — never hardcode it.
gemini:
  api-key: ${GEMINI_API_KEY:}
  # gemini-flash-latest always resolves to the newest Flash model; override via GEMINI_MODEL.
  model: ${GEMINI_MODEL:gemini-flash-latest}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  timeout-ms: ${GEMINI_TIMEOUT_MS:60000}

# Places provider: 'osm' (free OpenStreetMap Nominatim, no key) or 'google'
# (needs GOOGLE_PLACES_API_KEY). The app is fully functional with zero paid
# keys out of the box because 'osm' is the default.
places:
  provider: ${PLACES_PROVIDER:osm}
  nominatim:
    base-url: ${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
    user-agent: ${NOMINATIM_USER_AGENT:Wayfinder-AI/0.1}

google:
  places:
    api-key: ${GOOGLE_PLACES_API_KEY:}
    base-url: ${GOOGLE_PLACES_BASE_URL:https://places.googleapis.com}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
